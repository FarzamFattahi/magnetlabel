[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetlabel"
version = "0.2.0"
description = "Local segmentation annotation with magnetic edges, mask editing, and audited YOLO export"
authors = [{name = "Farzam Fattahi"}]
keywords = ["computer-vision", "segmentation", "annotation", "yolo", "grabcut"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3", "Pillow>=10.4,<13", "python-multipart>=0.0.20,<1", "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
magnetlabel = "magnetlabel.cli:main"

[project.urls]
Repository = "https://github.com/FarzamFattahi/magnetlabel"
Issues = "https://github.com/FarzamFattahi/magnetlabel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magnetlabel = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
